# Mises à jour hebdomadaires des dépendances : une pull request par groupe.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # Correctifs et versions mineures regroupés ; une majeure garde sa propre PR.
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
