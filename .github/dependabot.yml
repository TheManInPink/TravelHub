# Mises à jour des dépendances chaque semaine, avec une pull request par groupe.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # Les correctifs et les versions mineures sont regroupés. Une version majeure a sa propre PR.
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
