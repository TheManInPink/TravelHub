# Mises à jour des dépendances chaque semaine, avec une pull request par groupe.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # Les correctifs et les versions mineures sont regroupés. Une version majeure a sa propre PR.
      pip-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Nous restons sur Django 5.2 LTS, la seule version que SimpleJWT, Graphene-Django,
      # django-cors-headers et drf-spectacular déclarent toutes. Les correctifs 5.2.x
      # arrivent toujours dans la PR groupée. Pour Django 6, nous attendrons la 6.2 LTS.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node suit la version majeure de Node.js (26 LTS, comme engines et la CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # « typescript » est un alias vers @typescript/typescript6, l'API de TypeScript 6 dont
      # typescript-eslint a besoin. TypeScript 7 est installé à part, sous le nom typescript7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
