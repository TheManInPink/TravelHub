# TravelHub en conteneurs : docker compose up --build
#   API : http://localhost:8000/api/docs/   pgAdmin : http://localhost:5050
#   Front-end : http://localhost:3000, avec docker compose --profile frontend up --build
# Les variables sont lues dans .env, le même fichier qu'en développement local.

services:
  web:
    build: .
    image: travelhub:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # Remplace le DATABASE_URL de .env, qui pointe vers le PostgreSQL de l'hôte.
      DATABASE_URL: postgres://${POSTGRES_USER:-travelhub}:${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-travelhub}
      # En local on passe par HTTP, il n'y a pas de proxy HTTPS devant Gunicorn.
      SECURE_SSL_REDIRECT: "False"
      SECURE_HSTS_SECONDS: "0"
      # Le service frontend appelle Django à l'adresse http://web:8000, donc avec l'hôte
      # « web ». Il s'ajoute aux hôtes de .env.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},web
    # Pas de command : le CMD du Dockerfile applique les migrations à chaque démarrage,
    # puis lance Gunicorn, comme sur Render.
    ports:
      - "${WEB_PORT:-8000}:8000"
    # Journaux visibles avec docker compose logs web (JSON). Les fichiers rotatifs sont gardés ici.
    volumes:
      - web-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Front-end Next.js en sortie standalone. En ligne, il tourne sur Vercel. Ici, il sert à
  # lancer toute la pile sur notre poste : docker compose --profile frontend up --build.
  # Sans le profil, docker compose up démarre seulement web, db et pgadmin, comme avant, et
  # le port 3000 reste libre pour npm run dev.
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
        # Facultative et publique : l'adresse du projet Supabase, lue au build pour
        # next/image. Elle vient du .env de la racine (ou du terminal).
        SUPABASE_URL: ${SUPABASE_URL:-}
    image: travelhub-frontend:latest
    # SUPABASE_SECRET_KEY et SUPABASE_BUCKET, s'il existe un frontend/.env.local.
    env_file:
      - path: ./frontend/.env.local
        required: false
    # environment passe avant env_file : le DJANGO_API_URL de .env.local (Django lancé
    # sur notre poste) est remplacé par le service web. SUPABASE_URL a la même valeur
    # qu'au build, sinon next/image refuserait les images de couverture.
    environment:
      DJANGO_API_URL: http://web:8000
      SUPABASE_URL: ${SUPABASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travelhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-travelhub}
    # PostgreSQL 18 met ses données dans /var/lib/postgresql/18/docker, donc on monte le parent.
    volumes:
      - postgres-data:/var/lib/postgresql
    # Port non publié, car le PostgreSQL de l'hôte utilise déjà 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Définir PGADMIN_DEFAULT_PASSWORD dans .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    # Accessible seulement depuis cet ordinateur.
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

# Le serveur « TravelHub » est déjà déclaré dans pgAdmin au premier lancement.
configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "TravelHub (Docker)",
            "Group": "Servers",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-travelhub}",
            "Username": "${POSTGRES_USER:-travelhub}",
            "SSLMode": "prefer"
          }
        }
      }

volumes:
  postgres-data:
  pgadmin-data:
  web-logs:
