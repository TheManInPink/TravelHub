# TravelHub en conteneurs : docker compose up --build
#   API : http://localhost:8000/api/docs/   pgAdmin : http://localhost:5050
# Variables lues dans .env (le même fichier que pour le développement local).

services:
  web:
    build: .
    image: travelhub:latest
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # Remplace le DATABASE_URL de .env, qui vise le PostgreSQL de l'hôte.
      DATABASE_URL: postgres://${POSTGRES_USER:-travelhub}:${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-travelhub}
      # Accès local en HTTP, sans proxy HTTPS devant Gunicorn.
      SECURE_SSL_REDIRECT: "False"
      SECURE_HSTS_SECONDS: "0"
    # Migrations appliquées à chaque démarrage, avant le serveur.
    command: sh -c "python manage.py migrate --noinput && exec gunicorn config.wsgi"
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travelhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-travelhub}
    # PostgreSQL 18 range ses données dans /var/lib/postgresql/18/docker : on monte le parent.
    volumes:
      - postgres-data:/var/lib/postgresql
    # Port non publié : le PostgreSQL local de l'hôte occupe déjà 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Définir PGADMIN_DEFAULT_PASSWORD dans .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    # Accessible depuis cet ordinateur seulement.
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

# Serveur « TravelHub » déjà déclaré dans pgAdmin au premier lancement.
configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "TravelHub (Docker)",
            "Group": "Servers",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-travelhub}",
            "Username": "${POSTGRES_USER:-travelhub}",
            "SSLMode": "prefer"
          }
        }
      }

volumes:
  postgres-data:
  pgadmin-data:
