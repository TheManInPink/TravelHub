[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = apps
# Couverture à chaque exécution (configuration dans .coveragerc) : résumé dans le terminal,
# rapport détaillé dans htmlcov/index.html. --no-cov pour s'en passer (débogage, --pdb).
addopts = -ra --strict-markers --cov --cov-report=term-missing:skip-covered --cov-report=html
markers =
    slow: test lent (sous-processus) ; pytest -m "not slow" pour l'exclure
