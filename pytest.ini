[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = apps
# La couverture est calculée à chaque exécution (configuration dans .coveragerc). Le résumé
# s'affiche dans le terminal et le rapport détaillé est dans htmlcov/index.html.
# Ajouter --no-cov pour la désactiver (débogage, --pdb).
addopts = -ra --strict-markers --cov --cov-report=term-missing:skip-covered --cov-report=html
markers =
    slow: test lent (sous-processus) ; pytest -m "not slow" pour l'exclure
